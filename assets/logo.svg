<!-- The registered-trademark glyph that sits here in the live theme has been
     removed. At the sizes this lockup is used (168px wide on desktop, 124px on
     mobile) it renders 1.4px and 1.0px across, and its #3c3c3b grey scores
     1.73:1 against the #040E27 navy behind it — a sub-pixel smudge that is not
     legible as anything. Brands normally carry a minimum size below which the
     mark is dropped. Reinstate it from the master artwork for large or print
     use, where it has room to read. -->
<!-- The wordmark is white because in this design the mark only ever sits on
     the #040E27 navy — header, footer and menu. It is referenced with <img>,
     and currentColor resolves to black inside an <img>, so it cannot inherit.
     If it ever needs to go on a light band, inline the SVG and swap this to
     fill:currentColor. -->
